name: sync
on:
  workflow_dispatch:
    inputs:
      vars:
        description: 'KEY=value pairs for the pipeline, e.g. "RECONCILE=true MAX_BATCHES=8"'
        type: string
        default: ''
permissions:
  contents: read
  # lib's sync.yml starts the next run of a chain. A workflow that a job uses cannot
  # increase this permission.
  actions: write
concurrency: {group: sync, cancel-in-progress: false}
jobs:
  sync:
    uses: katoptra/lib/.github/workflows/sync.yml@f6343cde2c841df1f963370dd719b2a1006a8457 # v2.1.3
    with: {vars: '${{ inputs.vars }}', timeout-minutes: 60}
    secrets: inherit
