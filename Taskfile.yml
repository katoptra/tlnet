# Mirror CTAN's systems/texlive/tlnet, the tree tlmgr installs and updates from, into a
# Cloudflare R2 bucket, daily, from a list diff: dante's listing of the subtree against the
# state the last run left in the bucket. The toolbox, which starts a run, contains it in an
# image, resolves its secrets, renders and checks it, and reports it, and the rsync engine,
# which moves the bytes, checks the signatures and orders the pipeline, are katoptra/lib's,
# included below at v1 and flattened into this file. What is here is the mirror's own: its
# identity, the filter that narrows CTAN to the subtree, the landing page at the bucket
# root, and its row of the report. R2 is reached through the AWS CLI, configured by the
# three AWS_* repository secrets, which cross into the image by name (PASS).
version: '3'

vars:
  SOURCE: rsync://rsync.dante.ctan.org/CTAN/   # the master; a secondary mirror can lag it by a day
  HOST: tlnet.ijosh.com                         # a fork changes this line and the text in site/index.html
  BUCKET: tlnet                                 # bucket name; objects sit at its root under CTAN's own paths
  TL: systems/texlive/tlnet                     # the signed subtree, which is the whole mirror
  TL_KEY: C78B82D8C79512F79CC0D7C80D5E5D9106BAB6BC   # tug.org/texlive/verify.html
  CEILING_GB: 10                                # R2's free tier; refuse to run past this many decimal GB upstream
  LIST_FLOOR: 8500                              # a listing under this many lines is a truncated one; tlnet is ~17,000 files
  OWN: index.html                               # the landing page, the mirror's own key at the bucket root; reconcile spares it
  # SOURCE is CTAN's root and FILTER narrows the listing to the subtree, so every key keeps
  # its systems/texlive/tlnet/ prefix and the host works anywhere a CTAN mirror URL does.
  # rsync takes the first rule that matches: the two excludes drop the revision-stamped
  # duplicates (tlmgr asks for foo.tar.xz, which upstream symlinks to foo.r123.tar.xz; -L
  # resolves the stable name, and holding both would double the tree), the includes open
  # the path down to the subtree, and the last rule drops everything else.
  FILTER: >-
    --exclude='*.r[0-9]*.tar.xz' --exclude='/systems/texlive/tlnet/update-tlmgr-r*'
    --include=/systems/ --include=/systems/texlive/ --include='/systems/texlive/tlnet/***'
    --exclude='*'

env:
  AWS_CONFIG_FILE: '{{.ROOT_DIR}}/aws.config'

# Two includes, one namespace. A verb both an include and this file define is a parse
# error unless the include excludes it: the report hooks, and the one engine hook this
# mirror fills. MAX_BATCHES and RECONCILE are the engine's inline defaults, so a run sets
# them: task sync -- MAX_BATCHES=8 RECONCILE=true.
includes:
  toolbox:
    taskfile: https://raw.githubusercontent.com/katoptra/lib/v1/toolbox.yml
    flatten: true
    excludes: [report-engine, report-mirror]
    vars:
      NAME: tlnet
      DESC: a daily mirror of {{.SOURCE}}{{.TL}}/ at https://{{.HOST}}/{{.TL}}/
      IMAGE: ghcr.io/katoptra/toolbox:rsync-v1
      PASS: AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_ENDPOINT_URL
      MENU: >-
        ""
        "${c}listing -- dante over rsync, no credentials, inside the image${r}"
        "  task run -- task list     The subtree through FILTER, to .run/upstream.txt"
        "                    ${d}every path under {{.TL}}/, none revision-stamped; LIST_FLOOR is half its line count${r}"
  rsync:
    taskfile: https://raw.githubusercontent.com/katoptra/lib/v1/engines/rsync.yml
    flatten: true
    excludes: [index]

tasks:
  index:
    desc: Upload site/index.html, dated now, to the bucket root as the landing page
    set: [pipefail]   # a failed sed must never upload an empty page
    cmds:
      # Streamed, so the checked-in file is the only copy. The key sits at the bucket root,
      # outside the subtree, and a Cloudflare Transform Rule rewrites "/" to it; no-cache so
      # the edge and browsers refetch the page every visit. The stamp is written once the
      # upload landed, and report-mirror reads it.
      - >-
        d=$(date -u '+%Y-%m-%d %H:%M UTC') && sed "s|<!--UPDATED-->|$d|" {{.ROOT_DIR}}/site/index.html
        | aws s3 cp {{.AWS_FLAGS}} --content-type text/html --cache-control no-cache - {{.S3}}/index.html
        && echo "$d" > {{.RUN}}/index.txt

  report-mirror:
    desc: The mirror's row of the run summary, after the toolbox's and the engine's
    internal: true
    silent: true
    cmds:
      - 'echo "| Landing page | [https://{{.HOST}}/](https://{{.HOST}}/), $(test -f {{.RUN}}/index.txt && echo "dated $(cat {{.RUN}}/index.txt)" || echo "not re-uploaded this run") |" >> "${GITHUB_STEP_SUMMARY:-/dev/stdout}"'
